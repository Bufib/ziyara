name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run validate
      - run: npx expo-doctor@latest
      - run: npx expo export --platform web --output-dir dist/web
      - run: npx expo export --platform ios --output-dir dist/ios
      - run: npx expo export --platform android --output-dir dist/android
      - run: npm audit --omit=dev --audit-level=critical

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx supabase start
      - name: Verify account-deletion function auth gate
        run: |
          status="$(curl --silent --output /tmp/delete-account-response.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' http://127.0.0.1:54321/functions/v1/delete-account)"
          test "$status" = "401"
          node -e "const body = JSON.parse(require('node:fs').readFileSync('/tmp/delete-account-response.json', 'utf8')); if (body.code !== 'unauthorized') process.exit(1)"
      - run: npx supabase db lint --local --level warning
      - run: npx supabase test db --local
      - name: Run local full-stack E2E smoke flows
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/playwright/
          retention-days: 7
