name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run validate
      - run: npx expo-doctor@latest
      - run: npx expo export --platform web --output-dir dist/web
      - run: npx expo export --platform ios --output-dir dist/ios
      - run: npx expo export --platform android --output-dir dist/android
      - run: npm audit --omit=dev --audit-level=critical
